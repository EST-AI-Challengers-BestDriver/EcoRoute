name: EcoRoute CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ecoroute

jobs:
  build-test-deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------------------
      # Checkout
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v7

      # ----------------------------------------------------
      # CI
      # ----------------------------------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t ecoroute:${GITHUB_SHA} \
            .

      - name: Start smoke-test container
        run: |
          docker run -d \
            --name ecoroute-test \
            -p 18000:8000 \
            ecoroute:${GITHUB_SHA}

      - name: Smoke test
        run: |
          SUCCESS=0

          for i in $(seq 1 90); do
            if curl \
              --fail \
              --silent \
              http://127.0.0.1:18000/api/config \
              >/dev/null; then

              SUCCESS=1
              break
            fi

            echo "Waiting for EcoRoute... (${i}/90)"
            sleep 2
          done

          if [ "${SUCCESS}" -ne 1 ]; then
            echo "Smoke test failed."
            docker logs ecoroute-test
            exit 1
          fi

          echo "Smoke test passed."

      - name: Stop smoke-test container
        if: always()
        run: |
          docker rm -f ecoroute-test || true

      # ----------------------------------------------------
      # CD
      # main push에서만 아래 단계 실행
      # ----------------------------------------------------

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        if: github.event_name == 'push'
        id: push-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          docker tag \
            ecoroute:${GITHUB_SHA} \
            "${IMAGE_URI}"

          docker push "${IMAGE_URI}"

          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

          echo "Pushed image:"
          echo "${IMAGE_URI}"

      - name: Deploy to EC2 with SSM
        if: github.event_name == 'push'
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.push-image.outputs.image_uri }}
        run: |
          PARAMETERS=$(jq -nc \
            --arg image "${IMAGE_URI}" \
            '{commands:[("sudo /opt/ecoroute/deploy.sh " + $image)]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "${PARAMETERS}" \
            --comment "Deploy EcoRoute ${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: ${COMMAND_ID}"

          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS}"

            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query 'StandardOutputContent' \
                  --output text

                echo "Deployment successful."
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed."

                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query '{
                    Status:Status,
                    Stdout:StandardOutputContent,
                    Stderr:StandardErrorContent
                  }' \
                  --output json || true

                exit 1
                ;;
            esac

            sleep 3
          done

          echo "Deployment polling timed out."

          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --output json || true

          exit 1